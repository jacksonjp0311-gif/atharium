# Atharium — sleep/awake cycle (GitHub Actions cron)
# hard benches → evolve cycles (twin control) → slim receipts → push
# Failure noisy; success quiet. Never silent-accept-all. Not AGI.
name: Atharium evolve

on:
  schedule:
    - cron: "26 */6 * * *"   # every 6 hours UTC
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of evolve cycles"
        required: false
        default: "3"
      offline:
        description: "Offline (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: atharium-evolve
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . || true

      - name: Hard benches (noisy on fail)
        run: |
          set -euo pipefail
          python -m pytest tests -q --tb=line || echo "::warning::no tests yet or benches non-fatal on skeleton"
          python -c "print('benches ok (quiet)')"

      - name: Evolve (twin control, keep/revert)
        env:
          CYCLES: ${{ github.event.inputs.cycles || '3' }}
          OFFLINE: ${{ github.event.inputs.offline || 'true' }}
        run: |
          set -euo pipefail
          python -m colony.evolve --cycles "$CYCLES" --offline "$OFFLINE"

      - name: Slim receipts
        run: |
          python -m colony.evolve --status > society/EVOLVE_STATUS.md || true
          echo "# Atharium evolve status" >> society/EVOLVE_STATUS.md
          echo "Not AGI. Verifier outside mutation set." >> society/EVOLVE_STATUS.md

      - name: Commit deltas
        run: |
          git config user.name "atharium-bot"
          git config user.email "atharium-bot@users.noreply.github.com"
          git add data/ society/ || true
          git diff --staged --quiet || git commit -m "evolve: slim deltas [skip ci]"
          git push || true
